modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="justdirethings"
    type="required"
    versionRange="[${jdt_version},)"
    ordering="AFTER"
    side="BOTH"


[[mixins]]
    config="jdttimeaccelerators.mixins.json"

[[dependencies.${mod_id}]]
    modId="ae2"
    type="optional"
    versionRange="[19.2.0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="guideme"
    type="optional"
    versionRange="[21.1.0,)"
    ordering="AFTER"
    side="CLIENT"
