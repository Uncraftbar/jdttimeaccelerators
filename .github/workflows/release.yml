name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version shared by every release branch
        required: true
        default: 2.1.0
        type: string
      minecraft:
        description: Minecraft version branch to publish
        required: true
        default: 1.21.1
        type: choice
        options:
          - 1.21.1
          - 26.1.2
          - all
      publish:
        description: Upload to Modrinth, CurseForge, and GitHub Releases (disabled means dry run)
        required: true
        default: false
        type: boolean
      destination:
        description: Destinations to validate or publish
        required: true
        default: all
        type: choice
        options:
          - all
          - modrinth
          - curseforge

permissions:
  contents: write

concurrency:
  group: jdt-time-accelerators-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      artifact_count: ${{ steps.matrix.outputs.artifact_count }}
    steps:
      - name: Select release branches
        id: matrix
        shell: bash
        run: |
          case "${{ inputs.minecraft }}" in
            1.21.1)
              echo 'matrix={"include":[{"branch":"1.21.1","java":21,"archive":"jdttimeaccelerators-neoforge-1.21.1"}]}' >> "$GITHUB_OUTPUT"
              echo 'artifact_count=1' >> "$GITHUB_OUTPUT"
              ;;
            26.1.2)
              echo 'matrix={"include":[{"branch":"26.1.2","java":25,"archive":"jdttimeaccelerators-neoforge-26.1.2"}]}' >> "$GITHUB_OUTPUT"
              echo 'artifact_count=1' >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo 'matrix={"include":[{"branch":"1.21.1","java":21,"archive":"jdttimeaccelerators-neoforge-1.21.1"},{"branch":"26.1.2","java":25,"archive":"jdttimeaccelerators-neoforge-26.1.2"}]}' >> "$GITHUB_OUTPUT"
              echo 'artifact_count=2' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: Build ${{ matrix.branch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up compile toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Java 21 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify branch version
        shell: bash
        run: |
          actual_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "$actual_version" != "${{ inputs.version }}" ]]; then
            echo "${{ matrix.branch }} declares $actual_version, expected ${{ inputs.version }}" >&2
            exit 1
          fi

      - name: Build jar
        run: ./gradlew --no-daemon clean build

      - name: Collect release jar
        shell: bash
        run: |
          jar="build/libs/${{ matrix.archive }}-${{ inputs.version }}.jar"
          test -f "$jar"
          mkdir -p release-artifact
          cp "$jar" release-artifact/

      - name: Upload release jar
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.archive }}
          path: release-artifact/*.jar
          if-no-files-found: error

  publish:
    name: ${{ inputs.publish && 'Publish' || 'Dry run' }} ${{ inputs.version }}
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release configuration
        uses: actions/checkout@v4
        with:
          ref: '1.21.1'

      - name: Download all release jars
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release/artifacts
          merge-multiple: true

      - name: Verify release set
        shell: bash
        run: |
          find release/artifacts -maxdepth 1 -type f -name '*.jar' -print | sort
          count="$(find release/artifacts -maxdepth 1 -type f -name '*.jar' | wc -l)"
          test "$count" -eq "${{ needs.prepare.outputs.artifact_count }}"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove malformed Modrinth release before retry
        if: ${{ inputs.publish && (inputs.destination == 'all' || inputs.destination == 'modrinth') }}
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          case "${{ inputs.minecraft }}" in
            1.21.1) versions=("1.21.1") ;;
            26.1.2) versions=("26.1.2") ;;
            all) versions=("1.21.1" "26.1.2") ;;
          esac

          releases="$(curl --fail --silent --show-error \
            "https://api.modrinth.com/v2/project/SaLsAr3W/version?include_changelog=false")"

          for minecraft in "${versions[@]}"; do
            title="JDT Time Accelerators ${{ inputs.version }} $minecraft NeoForge"
            version_id="$(jq --raw-output --arg title "$title" \
              '.[] | select(.name == $title) | .id' <<< "$releases")"

            if [[ -z "$version_id" ]]; then
              continue
            fi

            version="$(curl --fail --silent --show-error \
              "https://api.modrinth.com/v2/version/$version_id")"
            if jq --exit-status --arg minecraft "$minecraft" '
              (.game_versions == [$minecraft])
              and (.loaders == ["neoforge"])
              and (.files | length == 1)
              and (.files[0].filename | endswith(".jar"))
            ' <<< "$version" >/dev/null; then
              continue
            fi

            echo "Removing malformed Modrinth version $version_id before retrying."
            curl --fail --silent --show-error \
              --request DELETE \
              --header "Authorization: $MODRINTH_TOKEN" \
              "https://api.modrinth.com/v2/version/$version_id"
          done

      - name: Run publisher
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          dry_run=true
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            dry_run=false
          fi
          publish_task=publishMods
          if [[ "${{ inputs.destination }}" == "modrinth" ]]; then
            publish_task=publishModrinthAll
          elif [[ "${{ inputs.destination }}" == "curseforge" ]]; then
            publish_task=publishCurseforgeAll
          fi
          ./release/gradlew -p release --no-daemon "$publish_task" \
            -PreleaseVersion="${{ inputs.version }}" \
            -PreleaseTargets="${{ inputs.minecraft }}" \
            -PdryRun="$dry_run"

      - name: Verify Modrinth release metadata
        if: ${{ inputs.publish && (inputs.destination == 'all' || inputs.destination == 'modrinth') }}
        shell: bash
        run: |
          case "${{ inputs.minecraft }}" in
            1.21.1) versions=("1.21.1") ;;
            26.1.2) versions=("26.1.2") ;;
            all) versions=("1.21.1" "26.1.2") ;;
          esac

          for minecraft in "${versions[@]}"; do
            title="JDT Time Accelerators ${{ inputs.version }} $minecraft NeoForge"
            verified=false

            for attempt in {1..6}; do
              releases="$(curl --fail --silent --show-error \
                "https://api.modrinth.com/v2/project/SaLsAr3W/version?include_changelog=false")"
              version_id="$(jq --raw-output --arg title "$title" \
                '.[] | select(.name == $title) | .id' <<< "$releases")"

              if [[ -n "$version_id" ]]; then
                version="$(curl --fail --silent --show-error \
                  "https://api.modrinth.com/v2/version/$version_id")"
                if jq --exit-status --arg minecraft "$minecraft" '
                  (.game_versions == [$minecraft])
                  and (.loaders == ["neoforge"])
                  and (.files | length == 1)
                  and (.files[0].filename | endswith(".jar"))
                ' <<< "$version" >/dev/null; then
                  verified=true
                  echo "Verified Modrinth version $version_id for Minecraft $minecraft / NeoForge."
                  break
                fi
              fi

              echo "Modrinth metadata is not consistent yet (attempt $attempt/6)."
              sleep 5
            done

            test "$verified" = true
          done

      - name: Create or update GitHub Release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ inputs.version }}"
          title="JDT Time Accelerators ${{ inputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file release/CHANGELOG.md
            gh release upload "$tag" release/artifacts/*.jar --clobber
          else
            gh release create "$tag" release/artifacts/*.jar \
              --target "1.21.1" \
              --title "$title" \
              --notes-file release/CHANGELOG.md
          fi

      - name: Upload dry-run output
        if: ${{ ! inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: publish-dry-run-${{ inputs.version }}
          path: release/build
          if-no-files-found: error
